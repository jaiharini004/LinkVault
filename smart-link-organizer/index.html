<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkVault - Smart Link Organizer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* Add Link Box */
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #4f46e5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        #addLinkBtn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #addLinkBtn:hover {
            background: #3730a3;
        }

        /* Search */
        .search-box {
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        /* Links */
        #linksContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .link-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .link-card:hover {
            transform: translateY(-4px);
        }

        .link-card h3 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;
            background: #ede9fe;
            color: #5b21b6;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .description {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .link-url {
            display: block;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .buttons button {
            border: none;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .open-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .edit-btn {
            background: #fef3c7;
            color: #92400e;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .favorite-btn {
            background: #fce7f3;
            color: #be185d;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 15px;
            position: relative;
        }

        .modal-content h2 {
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }

        #saveEditBtn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Empty message */
        .empty-message {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 30px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header h1 {
                font-size: 26px;
            }

            .container {
                width: 94%;
            }

            .form-box {
                padding: 18px;
            }

            #linksContainer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🔗 LinkVault</h1>
        <p>Smart Link Organizer</p>
    </header>


    <main class="container">

        <!-- Add Link Form -->
        <section class="form-box">

            <h2>➕ Add New Link</h2>

            <div class="form-group">
                <label for="titleInput">Title</label>
                <input
                    type="text"
                    id="titleInput"
                    placeholder="Enter link title"
                >
            </div>

            <div class="form-group">
                <label for="urlInput">URL</label>
                <input
                    type="url"
                    id="urlInput"
                    placeholder="https://example.com"
                >
            </div>

            <div class="form-group">
                <label for="categoryInput">Category</label>
                <input
                    type="text"
                    id="categoryInput"
                    placeholder="Example: Learning"
                >
            </div>

            <div class="form-group">
                <label for="descriptionInput">Description</label>
                <textarea
                    id="descriptionInput"
                    placeholder="Enter description"
                ></textarea>
            </div>

            <button id="addLinkBtn">
                Add Link
            </button>

        </section>


        <!-- Search -->
        <section class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search links..."
            >

        </section>


        <!-- Links -->
        <section id="linksContainer"></section>

    </main>


    <!-- Edit Modal -->
    <div class="modal" id="editModal">

        <div class="modal-content">

            <span class="close" id="closeModalBtn">&times;</span>

            <h2>✏️ Edit Link</h2>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="editTitle">
            </div>

            <div class="form-group">
                <label>URL</label>
                <input type="url" id="editUrl">
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="editCategory">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription"></textarea>
            </div>

            <button id="saveEditBtn">
                Save Changes
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="static/js/app.js"></script>

</body>
</html>
